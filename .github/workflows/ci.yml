name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Check public product contract
        run: npm run check:public-contract

      - name: Test public product contract gate
        run: npm run test:public-contract

      - name: Validate native privacy and permission declarations
        run: npm run check:mobile-native-config

      - name: Test fail-closed release gates
        run: npm run test:release-gates

      - name: Validate Expo project
        working-directory: apps/mobile
        run: npx expo-doctor

      - name: Bundle production JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform all --output-dir dist

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  server:
    name: Django and PostgreSQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: hlasimse_ci
          POSTGRES_USER: hlasimse
          # The GitHub-hosted service is isolated to this job and exposed only on
          # loopback, so CI uses PostgreSQL's explicit trust mode instead of a
          # hard-coded credential that could be mistaken for a reusable secret.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hlasimse -d hlasimse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://hlasimse@127.0.0.1:5432/hlasimse_ci
      DJANGO_DEBUG: "true"
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Audit locked production dependencies
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/hlasimse-server-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement "$RUNNER_TEMP/hlasimse-server-requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off

      - name: Run lint and formatting checks
        run: uv run ruff check . && uv run ruff format --check .

      - name: Check generated OpenAPI contract
        run: |
          uv run python manage.py spectacular --format openapi-json --validate --fail-on-warn \
            --file "$RUNNER_TEMP/hlasimse-openapi.json"
          diff --unified openapi.json "$RUNNER_TEMP/hlasimse-openapi.json"
          uv run pytest -q tests/test_openapi_contract.py

      - name: Validate migrations and deployment configuration
        run: >-
          uv run python manage.py makemigrations --check --dry-run &&
          uv run python manage.py check &&
          uv run python manage.py collectstatic --noinput

      - name: Validate production security configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-not-used-outside-this-deploy-check
          DJANGO_ALLOWED_HOSTS: ci.hlasim.se
          APP_BASE_URL: https://ci.hlasim.se
          SUPPORT_EMAIL: support@ci.hlasim.se
          LEGAL_TERMS_VERSION: 2026-07-21-ci
          MOBILE_MIN_IOS_VERSION: 1.0.0
          MOBILE_MIN_IOS_BUILD: "1"
          MOBILE_IOS_STORE_URL: https://apps.apple.com/app/hlasim-se/id1234567890
          MOBILE_MIN_ANDROID_VERSION: 1.0.0
          MOBILE_MIN_ANDROID_BUILD: "1"
          MOBILE_ANDROID_STORE_URL: https://play.google.com/store/apps/details?id=cz.hlasimse.app
          EXPO_ACCESS_TOKEN: ci-only-placeholder
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.ci.invalid
          EMAIL_HOST_USER: ci-user
          EMAIL_HOST_PASSWORD: ci-only-placeholder
          DEFAULT_FROM_EMAIL: Hlásím se CI <noreply@ci.hlasim.se>
        run: uv run python manage.py check --deploy

      - name: Run test suite on PostgreSQL
        run: uv run pytest

  production-container:
    name: Production container gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build production server image
        run: docker build --tag hlasimse-server:ci apps/server

      - name: Validate production image and runtime
        run: scripts/ci/validate-production-image.sh hlasimse-server:ci

      - name: Export production image for scanning
        run: docker image save --output "$RUNNER_TEMP/hlasimse-server.tar" hlasimse-server:ci

      - name: Scan production image
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP:/scan:ro"
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image
          --input /scan/hlasimse-server.tar
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --exit-code 1
          --no-progress
          --timeout 10m
