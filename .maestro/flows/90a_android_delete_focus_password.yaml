appId: ${APP_ID}
name: Android opens account deletion and focuses password
tags: [android, destructive-test-fixture]
---
- launchApp
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-settings"
      - extendedWaitUntil:
          visible: "Nastavení důvěry"
          timeout: 5000
- scrollUntilVisible:
    element:
      id: "account-delete-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "account-delete-open"
- assertVisible: "Nejdřív bezpečně uzavřete vlastní incidenty"
- scrollUntilVisible:
    element:
      id: "account-delete-password"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "account-delete-password"
