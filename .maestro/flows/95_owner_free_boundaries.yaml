appId: ${APP_ID}
name: Owner sees all free-tier boundaries without a paywall
tags:
  - simulator
  - owner
  - free-boundaries
---
- launchApp
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
- tapOn:
    id: "login-email-input"
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: ${OWNER_EMAIL}
      - pasteText
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${OWNER_EMAIL}
- tapOn:
    id: "login-password-input"
    retryTapIfNoChange: true
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: ${E2E_CREDENTIAL}
      - pasteText
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${E2E_CREDENTIAL}
      - tapOn:
          text: "Not Now"
          optional: true
- scrollUntilVisible:
    element:
      id: "login-submit-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "login-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- launchApp
- extendedWaitUntil:
    visible: "Vybraný profil E2E hranice 7 dní"
    timeout: 20000
- tapOn:
    id: "profile-switcher"
- scrollUntilVisible:
    element: "Využíváte všech 5 profilů."
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: "profile-create-open"
- tapOn:
    id: "profile-switcher"
- scrollUntilVisible:
    element:
      id: "profile-edit-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-edit-open"
- extendedWaitUntil:
    visible: "Profil 1 z 5.*"
    timeout: 10000
- assertVisible: "10080"
- assertVisible: "7 dní"
- tapOn:
    id: "back-button"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-guardians"
      - extendedWaitUntil:
          visible: "5/5 aktivních"
          timeout: 10000
- assertVisible:
    id: "guardian-invite-open"
    enabled: false
