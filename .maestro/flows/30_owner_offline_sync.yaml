appId: ${APP_ID}
name: Owner synchronizes a pending request after API recovery
tags:
  - simulator
  - offline
---
- launchApp
- extendedWaitUntil:
    notVisible: "Čeká na připojení — strážci zatím spoléhají na původní termín"
    timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-activity"
      - extendedWaitUntil:
          visible:
            id: "statistics-section"
          timeout: 5000
- scrollUntilVisible:
    element: "Synchronizováno později z offline fronty.*"
    direction: DOWN
    centerElement: true
