appId: ${APP_ID}
name: Owner explicitly deletes the test account after incidents are resolved
tags:
  - simulator
  - destructive-test-fixture
---
- launchApp
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-settings"
      - extendedWaitUntil:
          visible: "Nastavení důvěry"
          timeout: 5000
- scrollUntilVisible:
    element:
      id: "account-delete-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "account-delete-open"
- assertVisible: "Nejdřív bezpečně uzavřete vztahy"
- scrollUntilVisible:
    element:
      id: "account-delete-password"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "account-delete-password"
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: ${E2E_CREDENTIAL}
      - pasteText
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${E2E_CREDENTIAL}
- scrollUntilVisible:
    element:
      id: "account-delete-submit"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "account-delete-submit"
- assertVisible: "Trvale smazat účet?"
- tapOn: "Ano, smazat účet"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
