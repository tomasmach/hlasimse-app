appId: ${APP_ID}
name: Owner requests an account export and dismisses the system share sheet
tags:
  - simulator
  - export
---
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-settings"
      - extendedWaitUntil:
          visible:
            id: "account-export-open"
          timeout: 5000
- tapOn:
    id: "account-export-open"
- assertVisible: "Vaše data bez černé skříňky"
- tapOn:
    id: "account-export-submit"
- waitForAnimationToEnd:
    timeout: 15000
- pressKey: BACK
- extendedWaitUntil:
    visible: "Export server připravil a otevřel systémovou nabídku sdílení."
    timeout: 10000
