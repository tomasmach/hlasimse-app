appId: ${APP_ID}
name: Owner creates a second free safety profile
tags:
  - simulator
  - owner
  - profile
---
- scrollUntilVisible:
    element:
      id: "profile-switcher"
    direction: UP
    centerElement: true
- tapOn:
    id: "profile-switcher"
- extendedWaitUntil:
    visible:
      id: "profile-create-open"
    timeout: 10000
- tapOn:
    id: "profile-create-open"
- extendedWaitUntil:
    visible:
      id: "profile-create-name-input"
    timeout: 10000
- tapOn:
    id: "profile-create-name-input"
- inputText: "E2E druhý profil"
- tapOn:
    id: "profile-create-interval-input"
    retryTapIfNoChange: true
- eraseText: 4
- inputText: "120"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "profile-create-submit"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-create-submit"
- extendedWaitUntil:
    visible: "Vybraný profil E2E druhý profil"
    timeout: 15000
- assertVisible:
    id: "checkin-submit"
