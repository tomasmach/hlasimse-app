appId: ${APP_ID}
name: Owner login, confirmed check-in, pause, resume, history and guardian
tags:
  - simulator
  - owner
---
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "login-email-input"
      - assertVisible:
          id: "login-email-input"
          focused: true
- inputText: ${OWNER_EMAIL}
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "login-password-input"
      - assertVisible:
          id: "login-password-input"
          focused: true
- inputText: ${E2E_CREDENTIAL}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "checkin-submit"
    timeout: 20000
- assertVisible: "E2E bezpečnostní profil"
- tapOn:
    id: "checkin-submit"
- extendedWaitUntil:
    visible: "Check-in potvrzen serverem"
    timeout: 15000
- tapOn: "Check-in potvrzen serverem"
- extendedWaitUntil:
    visible:
      id: "profile-pause"
    timeout: 10000
- tapOn:
    id: "profile-pause"
- assertVisible: "Pozastavit profil?"
- tapOn: "Potvrdit pauzu"
- extendedWaitUntil:
    visible:
      id: "profile-resume"
    timeout: 15000
- tapOn:
    id: "profile-resume"
- assertVisible: "Obnovit profil?"
- tapOn: "Obnovit"
- extendedWaitUntil:
    visible:
      id: "profile-pause"
    timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-activity"
      - extendedWaitUntil:
          visible:
            id: "statistics-section"
          timeout: 5000
- assertVisible:
    id: "history-section"
- assertVisible: "Vyřešený incident"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-guardians"
      - extendedWaitUntil:
          visible: "E2E Strážce"
          timeout: 5000
- assertVisible: "1/5 aktivních"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-index"
      - extendedWaitUntil:
          visible:
            id: "checkin-submit"
          timeout: 5000
