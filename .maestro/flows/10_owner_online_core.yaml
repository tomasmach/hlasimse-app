appId: ${APP_ID}
name: Owner login, confirmed check-in, pause, resume, history and guardian
tags:
  - simulator
  - owner
---
- tapOn:
    id: "login-email-input"
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: ${OWNER_EMAIL}
      - pasteText
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${OWNER_EMAIL}
- tapOn:
    id: "login-password-input"
    retryTapIfNoChange: true
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: ${E2E_CREDENTIAL}
      - pasteText
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${E2E_CREDENTIAL}
- scrollUntilVisible:
    element:
      id: "login-submit-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "login-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- launchApp
- extendedWaitUntil:
    visible:
      id: "checkin-submit"
    timeout: 20000
- assertVisible: "Vybraný profil E2E bezpečnostní profil"
- tapOn:
    id: "checkin-submit"
- extendedWaitUntil:
    visible:
      id: "checkin-success-overlay"
    timeout: 10000
- tapOn:
    id: "checkin-success-overlay"
- extendedWaitUntil:
    visible: "Serverový termín aktivní"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "profile-pause"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "profile-pause"
- assertVisible: "Pozastavit profil?"
- tapOn: "Potvrdit pauzu"
- extendedWaitUntil:
    visible:
      id: "profile-resume"
    timeout: 15000
- tapOn:
    id: "profile-resume"
- assertVisible: "Obnovit profil?"
- tapOn: "Obnovit"
- extendedWaitUntil:
    visible:
      id: "profile-pause"
    timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-activity"
      - extendedWaitUntil:
          visible:
            id: "statistics-section"
          timeout: 5000
- scrollUntilVisible:
    element: "Vyřešený incident profilu E2E bezpečnostní profil"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      id: "history-section"
    direction: DOWN
    centerElement: true
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-guardians"
      - extendedWaitUntil:
          visible: "E2E Strážce"
          timeout: 5000
- assertVisible: "1/5 aktivních"
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "tab-index"
      - extendedWaitUntil:
          visible:
            id: "checkin-submit"
          timeout: 5000
