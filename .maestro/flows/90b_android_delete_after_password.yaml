appId: ${APP_ID}
name: Android deletes test account after password injection
tags: [android, destructive-test-fixture]
---
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "account-delete-submit"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "account-delete-submit"
- assertVisible: "Trvale smazat účet?"
- tapOn: "Ano, smazat účet"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 20000
