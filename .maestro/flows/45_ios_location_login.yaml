appId: ${APP_ID}
name: iOS owner prepares an authenticated location-permission check
tags:
  - simulator
  - ios
  - location
---
- launchApp
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 30000
- tapOn:
    id: "login-email-input"
- inputText: ${OWNER_EMAIL}
- tapOn:
    id: "login-password-input"
    retryTapIfNoChange: true
- inputText: ${E2E_CREDENTIAL}
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- scrollUntilVisible:
    element:
      id: "login-submit-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 5000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- launchApp
- extendedWaitUntil:
    visible:
      id: "checkin-submit"
    timeout: 20000
