appId: ${APP_ID}
name: Guardian clean install, onboarding, incident acknowledgement
tags:
  - simulator
  - guardian
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding-persona-screen"
    timeout: 30000
- tapOn:
    id: "onboarding-persona-alone"
- waitForAnimationToEnd:
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "onboarding-persona-continue-button"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible:
            id: "onboarding-empathy-screen"
          timeout: 5000
- tapOn:
    id: "onboarding-empathy-continue-button"
- extendedWaitUntil:
    visible:
      id: "onboarding-solution-screen"
    timeout: 10000
- tapOn:
    id: "onboarding-solution-continue-button"
- extendedWaitUntil:
    visible:
      id: "onboarding-demo-screen"
    timeout: 10000
- tapOn:
    id: "onboarding-demo-checkin-button"
- extendedWaitUntil:
    visible: "Nanečisto hotovo."
    timeout: 10000
- tapOn:
    id: "onboarding-demo-continue-button"
- extendedWaitUntil:
    visible:
      id: "onboarding-register-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "onboarding-register-login-button"
    direction: DOWN
- tapOn:
    id: "onboarding-register-login-button"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 10000
- tapOn:
    id: "login-email-input"
- inputText: ${GUARDIAN_EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${E2E_CREDENTIAL}
- hideKeyboard
- tapOn:
    id: "login-submit-button"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-activity"
    timeout: 20000
- tapOn:
    id: "tab-activity"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Aktivní incident profilu E2E bezpečnostní profil"
    timeout: 15000
- tapOn: "Aktivní incident profilu E2E bezpečnostní profil"
- extendedWaitUntil:
    visible:
      id: "incident-acknowledge"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "incident-acknowledge"
    direction: DOWN
- tapOn:
    id: "incident-acknowledge"
- extendedWaitUntil:
    visible: "Potvrzení uloženo serverem"
    timeout: 15000
- tapOn: "Zpět"
- tapOn:
    id: "tab-guardians"
    retryTapIfNoChange: true
- assertVisible: "Profily, které hlídám"
- assertVisible: "E2E bezpečnostní profil"
- tapOn:
    id: "tab-settings"
    retryTapIfNoChange: true
- tapOn: "Odhlásit se"
- assertVisible: "Odhlásit se?"
- tapOn: "Odhlásit"
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 15000
