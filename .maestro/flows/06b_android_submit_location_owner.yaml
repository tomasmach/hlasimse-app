appId: ${APP_ID}
name: Android submits owner login before location reset
tags:
  - android
  - location
---
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "login-submit-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "login-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- launchApp
- openLink: ${DEV_CLIENT_URL}
- extendedWaitUntil:
    visible:
      id: "checkin-submit"
    timeout: 30000
- assertVisible: "Vybraný profil E2E bezpečnostní profil"
